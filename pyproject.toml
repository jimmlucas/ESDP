[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esdp"
version = "2.0.0.dev0"
description = "Early Stop Decision Polishing for bacterial genome assemblies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ESDP contributors" }]
dependencies = [
  "imbalanced-learn>=0.9.0,<1.0.0",
  "joblib>=1.1.0,<2.0.0",
  "numpy>=1.22.0,<2.0.0",
  "pandas>=1.3.0,<3.0.0",
  "pydantic>=2.0.0,<3.0.0",
  "scikit-learn==1.5.2",
  "scipy>=1.7.0,<2.0.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.104.0,<1.0.0",
  "python-multipart>=0.0.6",
  "structlog>=23.2.0,<25.0.0",
  "uvicorn[standard]>=0.24.0,<1.0.0",
]
training = [
  "PyYAML>=5.4.0,<7.0.0",
  "matplotlib>=3.4.0,<4.0.0",
  "mord>=0.7",
  "plotly>=5.0.0,<6.0.0",
  "seaborn>=0.11.0,<1.0.0",
  "statsmodels>=0.13.0,<1.0.0",
  "tqdm>=4.62.0,<5.0.0",
  "xgboost==2.1.3",
]
dev = [
  "httpx>=0.24.0",
  "pytest>=7.0.0",
  "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
esdp = "esdp_cli:main"

[tool.setuptools]
py-modules = [
  "api_service",
  "esdp_cli",
  "esdp_decide",
  "esdp_features",
  "esdp_light",
  "esdp_light_features",
  "esdp_light_history",
  "esdp_light_metrics",
  "esdp_manifest",
  "esdp_trajectory",
]
packages = ["esdp_assets"]
package-dir = { esdp_assets = "models" }
include-package-data = false

[tool.setuptools.package-data]
esdp_assets = [
  "best_model_pipeline.pkl",
  "feature_names.txt",
  "model_manifest.v1.json",
]

[tool.pytest.ini_options]
testpaths = ["test"]
