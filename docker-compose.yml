services:
  esdp-api:
    build:
      context: .
      dockerfile: Dockerfile

    image: esdp:v2
    container_name: esdp-api

    ports:
      - "8000:8000"

    environment:
      - PORT=8000

    restart: unless-stopped

    read_only: true

    tmpfs:
      - /tmp

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - esdp-network

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G

networks:
  esdp-network:
    driver: bridge